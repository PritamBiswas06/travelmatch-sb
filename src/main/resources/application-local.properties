# ==================== LOCAL DEVELOPMENT ====================
# Active by default (see application.properties: spring.profiles.active).
# Every value below has a safe default for a fresh local MySQL install, but
# can be overridden with real environment variables without touching this
# file - e.g. if your local MySQL has a root password:
#   DB_PASSWORD=yourpassword mvn spring-boot:run

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelmatch?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pritam+#@1000}

spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
