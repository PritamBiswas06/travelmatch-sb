# ==================== PRODUCTION (Railway) ====================
# Activated by setting SPRING_PROFILES_ACTIVE=prod in Railway's environment
# variables (see application.properties for the default-to-local fallback).
#
# DB_URL / DB_USERNAME / DB_PASSWORD have NO fallback values on purpose:
# if they're missing, startup should fail loudly instead of silently
# connecting to nothing (or worse, falling back to the local defaults).
# Set them in Railway to the same values that were previously hardcoded:
#   DB_URL      = jdbc:mysql://mysql.railway.internal:3306/railway
#   DB_USERNAME = root
#   DB_PASSWORD = <the current production DB password>

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
