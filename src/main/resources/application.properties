# ? Web Push / VAPID - private key stays server-side only (WebPushService).
# Generate a keypair with: npx web-push generate-vapid-keys
# Empty-string fallbacks so a missing/misconfigured env var disables push
# gracefully (WebPushService catches the resulting init failure) instead of
# crashing the whole application context on startup.
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:travelmatch49@gmail.com}