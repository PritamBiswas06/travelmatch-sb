# Trust Center SMS gateway. Defaults to SMSLocal so an unset provider never prints OTPs in deployment.
# For local testing, activate the local profile (application-local.properties uses console mode).
travelmatch.sms.provider=${TRAVELMATCH_SMS_PROVIDER:smslocal}
travelmatch.sms.smslocal-api-key=${SMSLOCAL_API_KEY:}
travelmatch.sms.smslocal-sender-id=${SMSLOCAL_SENDER_ID:}
travelmatch.sms.smslocal-template-id=${SMSLOCAL_TEMPLATE_ID:}
travelmatch.sms.smslocal-endpoint=${SMSLOCAL_ENDPOINT:https://app.smslocal.in/api/smsapi}
# Identity/selfie provider adapter is intentionally not enabled until signed callbacks are implemented.
travelmatch.identity.provider-url=${TRAVELMATCH_IDENTITY_PROVIDER_URL:}
travelmatch.selfie.provider-url=${TRAVELMATCH_SELFIE_PROVIDER_URL:}

# Analytics privacy/retention. Raw analytics events are purged after 365 days.
travelmatch.analytics.retention-days=365
# Daily admin email summaries are opt-in; set both variables to enable.
travelmatch.analytics.daily-email-enabled=${TRAVELMATCH_ANALYTICS_DAILY_EMAIL_ENABLED:false}
travelmatch.analytics.email-recipients=${TRAVELMATCH_ANALYTICS_EMAILS:}

# Keep paid SMS verification disabled unless an operator deliberately enables it.
travelmatch.trust.phone-verification-enabled=${TRAVELMATCH_PHONE_VERIFICATION_ENABLED:false}
