# ==================== SHARED CONFIG (all environments) ====================
# Environment-specific values (datasource, secrets) live in
# application-local.properties / application-prod.properties instead of here.
# Nothing in this file needs to change between local dev and Railway.

spring.application.name=travelmatch

# Defaults to "local" so a plain `mvn spring-boot:run` / IDE run works out of
# the box. Railway MUST override this via the SPRING_PROFILES_ACTIVE=prod
# environment variable - see application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Railway assigns its own port via the PORT env var at runtime; 8080 is only
# used when PORT isn't set (i.e. local dev).
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Public frontend URL used to build links inside emails (dashboard, chat,
# review links). Defaults to production; application-local.properties
# overrides this to localhost:4200 so local emails link back correctly.
app.frontend-url=${FRONTEND_URL:https://tripmatch.fun}

# JWT signing secret. The fallback below is the value that was previously
# hardcoded in JwtService, kept as the default so existing tokens keep
# working even before JWT_SECRET is set in Railway. See JwtService.java.
jwt.secret=${JWT_SECRET:thisisaverysecuresecretkeythisisaverysecuresecretkey}

# Profile photo uploads (app-level limit enforced in UserService is 2MB;
# this is set a little higher so oversized uploads get our friendly message
# instead of the raw multipart error).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Brevo (transactional email)
#resend.api.key=${RESEND_API_KEY}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=travelmatch49@gmail.com
brevo.sender.name=Travel Match Team

# Web Push / VAPID - private key stays server-side only (WebPushService).
# Generate a keypair with: npx web-push generate-vapid-keys
# Empty-string fallbacks so a missing/misconfigured env var disables push
# gracefully (WebPushService catches the resulting init failure) instead of
# crashing the whole application context on startup.
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:travelmatch49@gmail.com}

